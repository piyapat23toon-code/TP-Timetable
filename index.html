<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TP Timetable</title>
  
  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <meta name="theme-color" content="#2b59c3">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f4f6f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Iframe เต็มหน้าจอ ไร้ขอบ ไร้ scrollbar ด้านนอก */
    #app-frame {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: radial-gradient(circle at center, #ffffff 0%, #eef2f7 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .logo-wrapper {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(43, 89, 195, 0.25);
      animation: pulse 2s infinite ease-in-out;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid #dbeafe;
      border-top-color: #2b59c3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      margin-top: 16px;
      font-size: 15px;
      font-weight: 500;
      color: #3b5998;
      letter-spacing: 0.3px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <!-- หน้าจอ Loading พร้อมไอคอน -->
  <div id="loading-screen">
    <div class="logo-wrapper">
      <img src="favicon.png" alt="TP Timetable Logo">
    </div>
    <div class="spinner"></div>
    <div class="loading-text">กำลังโหลด TP Timetable...</div>
  </div>

  <!-- Google Apps Script Iframe -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbx1e4GfDbpDtJddjY7FLh53J-UDIhkkFOWZ53jEzRNQdSJ8nERyQKiQ0klWEBCcSGrq/exec"
    allow="fullscreen; camera; microphone; geolocation"
    onload="hideLoading()">
  </iframe>

  <script>
    function hideLoading() {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => {
          loader.remove();
        }, 550);
      }
    }

    // กันกรณีเครือข่ายช้าหรือไม่ trigger onload ให้ fade out อัตโนมัติหลัง 8 วินาที
    setTimeout(() => {
      hideLoading();
    }, 8000);
  </script>
</body>
</html>
